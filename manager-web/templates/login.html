<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 로그인</title>
</head>
<body style="background: #121212; color: #fff; text-align: center; padding-top: 100px; font-family: sans-serif; position: relative; height: 100vh; margin: 0; box-sizing: border-box;">
    <h2>🔒 관리자 로그인</h2>
    <form method="POST">
        <input type="text" name="username" placeholder="아이디" required style="padding: 10px; margin: 5px; width: 200px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px;"><br>
        <input type="password" name="password" placeholder="비밀번호" required style="padding: 10px; margin: 5px; width: 200px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px;"><br>
        <button type="submit" style="padding: 10px 20px; margin-top: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">로그인</button>
    </form>

    <!-- 오른쪽 아래 크레딧 문구 -->
    <div style="position: fixed; bottom: 15px; right: 20px; color: #666; font-size: 13px;">
        made by 하늘하늘_
    </div>
</body>
</html>
